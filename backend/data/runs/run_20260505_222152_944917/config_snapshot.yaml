export:
  default_format: jsonl
generation:
  default_batch_size: 10
  max_retries_on_empty: 2
measurement_phrases:
- outer diameter
- inner diameter
models:
  cheap_fast:
    enabled: true
    model: openai/gpt-4o-mini
    notes: Fast bulk generation candidate. Good for high-volume first-pass generation.
    provider: tokenrouter
  creative_mutator:
    enabled: true
    model: anthropic/claude-sonnet
    notes: Useful for adversarial phrasing and edge case mutation.
    provider: tokenrouter
  validator_strict:
    enabled: true
    model: openai/gpt-4o-mini
    notes: Higher accuracy validation candidate. Use for semantic validation.
    provider: tokenrouter
profiles:
  adversarial:
    max_tokens: 250
    retry_count: 2
    temperature: 1.0
    timeout: 45
  cheap_bulk:
    max_tokens: 120
    retry_count: 3
    temperature: 0.7
    timeout: 30
  strict_validator:
    max_tokens: 300
    retry_count: 2
    temperature: 0.1
    timeout: 60
project:
  domain: measurement_extraction
  name: measurement_dataset_foundry
prompts:
  generator_clean_v1:
    active: true
    notes: Initial clean semantic generator. Produces natural spoken-style measurements.
    task: generation
    template: 'Generate a single natural-language utterance that expresses the following
      measurement.

      The utterance should sound like something a person would say to a measurement
      device.

      Do not include any metadata, labels, or JSON. Output only the utterance text.


      Measurement details:

      - Phrase: {measurement_phrase}

      - Value kind: {value_kind}

      - Nominal value: {value_nominal}

      - Min value: {value_min}

      - Max value: {value_max}

      - Tolerance: {value_tolerance}

      - Unit: {unit_norm}


      Examples of good utterances:

      - "Outer diameter is sixty five millimeters."

      - "The width should be between 10 and 15 millimeters."

      - "Thickness approximately 2.5 centimeters."

      - "Radius at least 8 mm."


      Output only the utterance. No quotes, no labels, no explanation.

      '
    title: Clean Semantic Generator v1
    version: 1
  generator_diverse_v1:
    active: false
    notes: Alternative generator focused on phrasing diversity.
    task: generation
    template: 'Generate a single natural-language utterance expressing this measurement.

      Use varied, diverse phrasing. The utterance should be how an engineer or

      technician might naturally say it - informal, direct, varied in structure.

      Do not include any metadata. Output only the utterance.


      Measurement:

      - Phrase: {measurement_phrase}

      - Value kind: {value_kind}

      - Nominal value: {value_nominal}

      - Min value: {value_min}

      - Max value: {value_max}

      - Tolerance: {value_tolerance}

      - Unit: {unit_norm}


      Output only the utterance.

      '
    title: Diverse Phrasing Generator v1
    version: 1
  mutator_edge_cases_v1:
    active: false
    notes: Generates adversarial edge cases for robustness testing.
    task: mutation
    template: 'Rewrite the following utterance to be more challenging or ambiguous
      while

      preserving the core measurement information. Create an edge case that would

      test a measurement extraction system.


      Original: "{generated_text}"

      Measurement: {measurement_phrase} = {value_nominal} {unit_norm}


      Output only the rewritten utterance.

      '
    title: Edge Case Mutator v1
    version: 1
  validator_strict_v1:
    active: true
    notes: Strict extraction validator. Returns structured JSON for comparison against
      truth.
    task: validation
    template: "Extract the measurement information from the following utterance and\
      \ return it as JSON.\n\nUtterance: \"{generated_text}\"\n\nReturn a JSON object\
      \ with these fields (use null for missing values):\n{{\n  \"measurement_phrase\"\
      : \"<the measurement being described>\",\n  \"value_kind\": \"<exact|approx|range|tolerance|min_only|max_only|min_max>\"\
      ,\n  \"value_nominal\": <number or null>,\n  \"value_min\": <number or null>,\n\
      \  \"value_max\": <number or null>,\n  \"value_tolerance\": <number or null>,\n\
      \  \"unit_norm\": \"<mm|cm|in or null>\"\n}}\n\nReturn only the JSON object.\
      \ No explanation, no markdown.\n"
    title: Strict Semantic Validator v1
    version: 1
tasks:
  generation:
    model_ref: cheap_fast
    profile_ref: cheap_bulk
    prompt_ref: generator_clean_v1
  mutation:
    model_ref: creative_mutator
    profile_ref: adversarial
    prompt_ref: mutator_edge_cases_v1
  summarization:
    model_ref: validator_strict
    profile_ref: strict_validator
    prompt_ref: validator_strict_v1
  validation:
    model_ref: validator_strict
    profile_ref: strict_validator
    prompt_ref: validator_strict_v1
units:
  allowed:
  - cm
validation:
  max_text_length: 500
  min_text_length: 5
value_kinds:
  allowed:
  - exact
